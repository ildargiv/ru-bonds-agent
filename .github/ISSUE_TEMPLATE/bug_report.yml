name: Ошибка
description: Что-то работает не так, как описано
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Не прикладывайте ключи, токены, отчёты брокера и данные портфеля.
  - type: dropdown
    id: runtime
    attributes:
      label: Где запускаете агента
      options: [Hermes Agent, OpenClaw, Claude Code, Codex CLI, Другое]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Система
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия (ru-bonds-agent)
      placeholder: v1.0.0 или коммит
  - type: textarea
    id: what
    attributes:
      label: Что произошло
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидали
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
